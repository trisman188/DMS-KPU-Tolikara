version: '3.8'

services:
  # 1. Aplikasi Core Web PHP (VaultSafe V2 Engine)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaultsafe-app:v2
    container_name: vaultsafe-php-v2
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vaultsafe_db:/var/www/database
      - vaultsafe_storage:/var/www/storage/encrypted

    environment:
      - STORAGE_DRIVER=minio
      - MINIO_ENDPOINT=storage:9000
      - MINIO_ACCESS_KEY=vaultsafe_admin
      - MINIO_SECRET_KEY=vaultsafe_secret_key

  # 2. Web Server Nginx (Tampilan Profesional & Reverse Proxy)
  webserver:
    image: nginx:alpine
    container_name: vaultsafe-nginx-v2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

      # 3. Object Storage Service (MinIO via Coollabs Mirror)
  storage:
    image: ghcr.io/coollabsio/minio:latest
    container_name: vaultsafe-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=vaultsafe_admin
      - MINIO_ROOT_PASSWORD=vaultsafe_secret_key
    volumes:
      # PERBAIKAN: Jalur internal disesuaikan kembali ke /data untuk Coollabs
      - minio_data:/data
    command: server /data --console-address ":9001"

# DAFTAR VOLUME PERMANEN YANG DIKELOLA DOCKER (Tulis 1 kali saja di paling bawah)
volumes:
  minio_data:
  vaultsafe_db:
  vaultsafe_storage:

